<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Archivo Real | Registro sin indice</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Georgia, "Times New Roman", serif;
        background: #151917;
        color: #e7e1d5;
      }
      body {
        box-sizing: border-box;
        max-width: 760px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 64px 24px;
      }
      .eyebrow {
        color: #c59a62;
        font: 12px/1.5 Arial, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      h1 {
        margin: 12px 0;
        font-size: clamp(36px, 8vw, 64px);
        font-weight: 400;
      }
      p {
        max-width: 56ch;
        color: #b7b9b2;
        font: 16px/1.7 Arial, sans-serif;
      }
      figure {
        margin: 40px 0 16px;
        padding: 20px;
        border: 1px solid #44483f;
        background: #1d211e;
      }
      img {
        display: block;
        width: min(100%, 560px);
        height: auto;
        margin: 0 auto;
      }
      figcaption {
        margin-top: 12px;
        color: #8e928a;
        font: 12px/1.5 Arial, sans-serif;
      }
      a { color: #d6b17c; }
      a:focus-visible { outline: 2px solid #d6b17c; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <p class="eyebrow">Archivo real / acceso fuera del indice</p>
    <h1>El cuervo observa.</h1>
    <p>Este registro llego sin leyenda. Conserva la imagen y examina el archivo completo; no todo lo que guarda una imagen se ve en pantalla.</p>
    <figure>
      <a href="/royal-archives/three-eyed-raven.svg" download="three-eyed-raven.svg">
        <img src="/royal-archives/three-eyed-raven.svg" alt="Silueta de un cuervo de tres ojos" />
      </a>
      <figcaption>Registro 03 / imagen archivada</figcaption>
    </figure>
  </body>
</html>
